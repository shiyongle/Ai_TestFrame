version: '3.9'

# 推荐宿主机规格：
# - 最低可跑：2 vCPU / 4 GB RAM
# - 推荐生产：4 vCPU / 8 GB RAM
# - 若频繁使用 UI 自动化 / 性能测试 / RAG 导入：8 vCPU / 16 GB RAM

services:
  mysql:
    image: mysql:8.0
    container_name: ai_testframe_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-s3cr3t}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_system}
      MYSQL_USER: ${MYSQL_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpass}
    ports:
      - "3306:3306"
    cpus: "${MYSQL_CPUS:-1.0}"
    mem_limit: "${MYSQL_MEM_LIMIT:-1g}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/init_mysql.sql:/docker-entrypoint-initdb.d/init_mysql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - ai_test_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ai-testframe/backend:${IMAGE_TAG:-latest}
    container_name: ai_testframe_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_system}
      MYSQL_USER: ${MYSQL_USER:-testuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testpass}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-300}
      DB_POOL_PRE_PING: ${DB_POOL_PRE_PING:-true}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-ai_testframe_default_secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://localhost:3000"]}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GLM_API_KEY: ${GLM_API_KEY:-}
      TONGYI_API_KEY: ${TONGYI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NEWAPI_API_KEY: ${NEWAPI_API_KEY:-}
      NEWAPI_BASE_URL: ${NEWAPI_BASE_URL:-}
      NEWAPI_CHAT_MODEL: ${NEWAPI_CHAT_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-siliconflow}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-500}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-50}
      RAG_MAX_FEATURES: ${RAG_MAX_FEATURES:-1000}
      CHROMA_PERSIST_DIR: ${CHROMA_PERSIST_DIR:-/app/data/chroma}
      WORKFLOW_MAX_EXECUTION_TIME: ${WORKFLOW_MAX_EXECUTION_TIME:-3600}
      WORKFLOW_MAX_CONCURRENT: ${WORKFLOW_MAX_CONCURRENT:-10}
    ports:
      - "8000:8000"
    cpus: "${BACKEND_CPUS:-2.0}"
    mem_limit: "${BACKEND_MEM_LIMIT:-4g}"
    shm_size: "${BACKEND_SHM_SIZE:-1gb}"
    volumes:
      - backend_logs:/app/logs
      - backend_data:/app/data
      - backend_ui_artifacts:/app/ui_artifacts
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - ai_test_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    image: ai-testframe/frontend:${IMAGE_TAG:-latest}
    container_name: ai_testframe_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    cpus: "${FRONTEND_CPUS:-0.5}"
    mem_limit: "${FRONTEND_MEM_LIMIT:-256m}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - ai_test_network

volumes:
  mysql_data:
  backend_logs:
  backend_data:
  backend_ui_artifacts:

networks:
  ai_test_network:
    driver: bridge
